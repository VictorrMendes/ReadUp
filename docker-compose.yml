services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: readup
      POSTGRES_USER: readup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readup -d readup"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://readup:${POSTGRES_PASSWORD}@db:5432/readup
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      MYMEMORY_EMAIL: ${MYMEMORY_EMAIL:-}
      PDF_STORAGE_DIR: /app/storage/pdfs
      NEWS_FETCH_HOURS: ${NEWS_FETCH_HOURS:-6}
      NEWS_CONTACT: ${NEWS_CONTACT:-}
    volumes:
      - ./storage/pdfs:/app/storage/pdfs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
