<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 280">
<!-- Fundo do topo do Início (390x280 dp, largura da tela). Saudação, XP e ofensiva em branco
     na zona x 0-250; a parte de baixo (y > 216) fica atrás do cartão da meta. -->
<defs>
<linearGradient id="bg" x1="0" y1="0" x2=".55" y2="1">
<stop offset="0" stop-color="#2F6BF0"/>
<stop offset="1" stop-color="#1D4ED8"/>
</linearGradient>
<radialGradient id="glow" cx="350" cy="20" r="160" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#FFFFFF" stop-opacity=".18"/>
<stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
</radialGradient>
<radialGradient id="orb" cx=".35" cy=".3" r=".75">
<stop offset="0" stop-color="#DBEAFE"/>
<stop offset=".45" stop-color="#7CA0FA"/>
<stop offset="1" stop-color="#2563EB"/>
</radialGradient>
</defs>
<rect width="390" height="280" fill="url(#bg)"/>
<rect width="390" height="280" fill="url(#glow)"/>
<!-- folhas empilhadas, só contorno de luz, à direita -->
<g transform="translate(314 120) rotate(-8)">
<rect x="-50" y="-70" width="120" height="160" rx="18" fill="#FFFFFF" fill-opacity=".07"/>
</g>
<g transform="translate(326 112) rotate(6)">
<rect x="-50" y="-70" width="120" height="160" rx="18" fill="#FFFFFF" fill-opacity=".1"/>
<path d="M28,-70 L48,-70 L48,-34 L38,-42 L28,-34 Z" fill="#FFFFFF" fill-opacity=".35"/>
<rect x="-30" y="-20" width="60" height="8" rx="4" fill="#FFFFFF" fill-opacity=".22"/>
<rect x="-30" y="0" width="84" height="8" rx="4" fill="#FFFFFF" fill-opacity=".22"/>
<rect x="-30" y="20" width="22" height="8" rx="4" fill="#FFFFFF" fill-opacity=".22"/>
<rect x="-2" y="18" width="50" height="12" rx="6" fill="#FFFFFF" fill-opacity=".45"/>
</g>
<circle cx="262" cy="34" r="10" fill="url(#orb)"/>
<circle cx="368" cy="214" r="14" fill="url(#orb)" opacity=".85"/>
<path d="M-20,236 C80,212 170,230 260,208 C320,194 370,188 410,192 L410,280 L-20,280 Z" fill="#1D4ED8" fill-opacity=".5"/>
</svg>
