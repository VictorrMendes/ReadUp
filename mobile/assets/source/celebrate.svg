<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
<!-- Ilustração da conclusão da leitura (160 dp, fundo transparente, decorativa).
     Folha do ícone com o marcador, o grifo e um selo de concluído; brilhos dourados (recompensa). -->
<defs>
<radialGradient id="halo" cx=".5" cy=".5" r=".5">
<stop offset="0" stop-color="#DBEAFE"/>
<stop offset="1" stop-color="#DBEAFE" stop-opacity="0"/>
</radialGradient>
<filter id="sh" x="-30%" y="-30%" width="160%" height="170%">
<feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1D4ED8" flood-opacity=".22"/>
</filter>
</defs>
<circle cx="80" cy="82" r="76" fill="url(#halo)"/>
<rect x="44" y="34" width="72" height="96" rx="12" fill="#BFDBFE" transform="rotate(-9 80 82)"/>
<g filter="url(#sh)">
<rect x="44" y="30" width="72" height="98" rx="12" fill="#FFFFFF" transform="rotate(4 80 80)"/>
</g>
<g transform="rotate(4 80 80)">
<path d="M90,30 L104,30 L104,56 L97,50 L90,56 Z" fill="#1D4ED8" stroke="#1D4ED8" stroke-width="2" stroke-linejoin="round"/>
<rect x="54" y="62" width="36" height="6" rx="3" fill="#DBEAFE"/>
<rect x="54" y="76" width="50" height="6" rx="3" fill="#DBEAFE"/>
<rect x="54" y="90" width="12" height="6" rx="3" fill="#DBEAFE"/>
<rect x="69" y="88" width="34" height="10" rx="5" fill="#2563EB"/>
<rect x="54" y="104" width="44" height="6" rx="3" fill="#DBEAFE"/>
</g>
<!-- selo de concluído -->
<circle cx="112" cy="116" r="17" fill="#16A34A" stroke="#FFFFFF" stroke-width="4"/>
<path d="M104,116 L110,122 L121,110" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<!-- brilhos -->
<path d="M30,40 L33,49 L42,52 L33,55 L30,64 L27,55 L18,52 L27,49 Z" fill="#F59E0B"/>
<path d="M132,30 L134,36 L140,38 L134,40 L132,46 L130,40 L124,38 L130,36 Z" fill="#F59E0B"/>
<path d="M140,76 L141.5,80.5 L146,82 L141.5,83.5 L140,88 L138.5,83.5 L134,82 L138.5,80.5 Z" fill="#2563EB"/>
<circle cx="24" cy="98" r="4" fill="#2563EB"/>
<circle cx="120" cy="16" r="3" fill="#F59E0B"/>
<circle cx="40" cy="138" r="3.5" fill="#F59E0B"/>
</svg>
