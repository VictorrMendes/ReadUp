name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: readup
          POSTGRES_USER: readup
          POSTGRES_PASSWORD: readup
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U readup -d readup"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://readup:readup@127.0.0.1:5432/readup
      JWT_SECRET: ci-only-secret-key-readup-github-actions
      NEWS_FETCH_HOURS: "0"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.x"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy app tests

      - name: Tests
        run: uv run pytest

      - name: Migrations match models
        run: uv run alembic check

      - name: Docker build
        run: docker build -t readup-api:ci .

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v7

      # o build Android do Flutter 3.47 pede Java 17+
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

      # compila o app de verdade (Gradle + Dart AOT): pega o que analyze e testes não pegam
      - name: Build APK (dev)
        run: flutter build apk --debug -t lib/main_dev.dart

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      READUP_API_URL: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: "1"

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
