name: CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # =========================================================
  # BACKEND
  # =========================================================

  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_DB: readup
          POSTGRES_USER: readup
          POSTGRES_PASSWORD: readup

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U readup -d readup"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://readup:readup@127.0.0.1:5432/readup
      JWT_SECRET: ci-only-secret-key-readup-github-actions
      NEWS_FETCH_HOURS: "0"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "latest-known"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy app tests

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Tests
        run: uv run pytest

      - name: Validate migrations
        run: uv run alembic check

      - name: Docker build
        run: docker build -t readup-api:ci .

  # =========================================================
  # MOBILE
  # =========================================================

  mobile:
    name: Mobile
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Tests
        run: npm test -- --runInBand

  # =========================================================
  # WEB
  # =========================================================

  web:
    name: Web
    runs-on: ubuntu-latest

    env:
      READUP_API_URL: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: "1"

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
